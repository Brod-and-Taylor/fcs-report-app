<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Launch FCS Dates</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f6f7fb;
      color: #323338;
    }

    /* ── Password Gate ── */
    #password-gate {
      display: none;
      position: fixed;
      inset: 0;
      background: #f6f7fb;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    #password-gate.show { display: flex; }
    .pw-box {
      background: #fff;
      border-radius: 12px;
      padding: 40px 36px 36px;
      width: 400px;
      max-width: calc(100vw - 48px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      text-align: center;
    }
    .pw-box h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .pw-box p  { color: #676879; font-size: 13px; margin-bottom: 24px; }
    #pw-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #c5c7d4;
      border-radius: 6px;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
      text-align: center;
      letter-spacing: 0.1em;
    }
    #pw-input:focus { border-color: #0073ea; box-shadow: 0 0 0 3px rgba(0,115,234,0.15); }
    #pw-input.error { border-color: #e2445c; box-shadow: 0 0 0 3px rgba(226,68,92,0.15); }
    #pw-error { color: #e2445c; font-size: 12px; min-height: 18px; margin-bottom: 10px; }
    #pw-submit {
      width: 100%;
      padding: 10px;
      background: #0073ea;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #pw-submit:hover { background: #0060c0; }

    /* ── Token Modal ── */
    #token-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #token-modal.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      width: 460px;
      max-width: calc(100vw - 48px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .modal-box h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .modal-box p  { color: #676879; font-size: 13px; line-height: 1.6; margin-bottom: 20px; }
    .modal-box a  { color: #0073ea; }
    #token-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #c5c7d4;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
      font-family: monospace;
      letter-spacing: 0.03em;
    }
    #token-input:focus { border-color: #0073ea; box-shadow: 0 0 0 3px rgba(0,115,234,0.15); }
    #connect-btn {
      width: 100%;
      padding: 10px;
      background: #0073ea;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #connect-btn:hover { background: #0060c0; }

    /* ── Header ── */
    .header {
      background: #fff;
      border-bottom: 1px solid #e6e9ef;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    #last-updated    { font-size: 12px; color: #676879; }
    #next-refresh    { font-size: 11px; color: #c5c7d4; }

    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }
    .btn-ghost   { background: transparent; border: 1px solid #c5c7d4; color: #676879; }
    .btn-ghost:hover { background: #f6f7fb; }
    .btn-primary { background: #0073ea; color: #fff; }
    .btn-primary:hover { background: #0060c0; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── History button badge ── */
    .btn-history {
      background: transparent;
      border: 1px solid #c5c7d4;
      color: #676879;
      position: relative;
    }
    .btn-history:hover { background: #f6f7fb; }
    .btn-history.active {
      background: #f0f7ff;
      border-color: #0073ea;
      color: #0073ea;
    }
    #history-badge {
      display: none;
      position: absolute;
      top: -5px;
      right: -5px;
      background: #e2445c;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      padding: 0 4px;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    #history-badge.show { display: flex; }

    /* ── Layout with sidebar ── */
    .app-body {
      display: flex;
      height: calc(100vh - 56px);
      overflow: hidden;
    }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      transition: margin-right 0.3s ease;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px 24px 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* ── History Sidebar ── */
    #history-sidebar {
      width: 0;
      overflow: hidden;
      background: #fff;
      border-left: 1px solid #e6e9ef;
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease;
      flex-shrink: 0;
    }
    #history-sidebar.open {
      width: 360px;
    }
    .sidebar-inner {
      width: 360px;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid #e6e9ef;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 15px;
      font-weight: 700;
      color: #323338;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-title svg { color: #676879; }
    .sidebar-close {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #676879;
      font-size: 16px;
      transition: background 0.15s;
    }
    .sidebar-close:hover { background: #f6f7fb; }

    /* Filter tabs inside sidebar */
    .sidebar-filters {
      display: flex;
      gap: 4px;
      padding: 10px 14px 8px;
      border-bottom: 1px solid #f0f1f5;
      flex-shrink: 0;
    }
    .filter-chip {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #e6e9ef;
      background: transparent;
      color: #676879;
      transition: all 0.12s;
    }
    .filter-chip:hover { border-color: #0073ea; color: #0073ea; }
    .filter-chip.active { background: #0073ea; border-color: #0073ea; color: #fff; }

    /* Sidebar body / log */
    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0 20px;
    }
    .sidebar-empty {
      padding: 40px 20px;
      text-align: center;
      color: #9699a6;
      font-size: 13px;
      line-height: 1.6;
    }
    .sidebar-empty svg {
      display: block;
      margin: 0 auto 12px;
      opacity: 0.3;
    }

    /* Change entry */
    .change-entry {
      padding: 10px 18px 10px;
      border-bottom: 1px solid #f3f4f8;
      cursor: default;
      transition: background 0.1s;
    }
    .change-entry:last-child { border-bottom: none; }
    .change-entry:hover { background: #fafbfd; }
    .change-entry-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .change-item-name {
      font-size: 12px;
      font-weight: 600;
      color: #323338;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .change-time {
      font-size: 10px;
      color: #9699a6;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .change-detail {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .change-field {
      font-size: 11px;
      font-weight: 600;
      color: #676879;
      background: #f3f4f8;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .change-arrow {
      font-size: 11px;
      color: #9699a6;
    }
    .change-from {
      font-size: 11px;
      color: #9699a6;
      text-decoration: line-through;
    }
    .change-to {
      font-size: 11px;
      font-weight: 600;
      color: #323338;
    }
    .change-to.conf-high   { color: #00843d; }
    .change-to.conf-mid    { color: #3d73ea; }
    .change-to.conf-low    { color: #c87400; }
    .change-to.conf-vlow   { color: #7a7a7a; }

    /* Date changes */
    .change-to.date-change { color: #0073ea; }

    /* Group label pill */
    .change-group {
      font-size: 10px;
      color: #9699a6;
      margin-top: 3px;
    }

    /* Sidebar loading */
    .sidebar-loading {
      padding: 40px 20px;
      text-align: center;
      color: #9699a6;
      font-size: 12px;
    }

    /* ── Chart ── */
    .chart-header {
      display: flex;
      padding-bottom: 10px;
      border-bottom: 1px solid #e6e9ef;
      margin-bottom: 2px;
    }
    .label-spacer { flex-shrink: 0; }
    .months-bar   { position: relative; flex: 1; height: 22px; }

    .month-tick {
      position: absolute;
      font-size: 11px;
      font-weight: 600;
      color: #676879;
      transform: translateX(-50%);
      white-space: nowrap;
      user-select: none;
      bottom: 0;
    }
    .today-tick {
      position: absolute;
      bottom: 0;
      font-size: 10px;
      font-weight: 700;
      color: #e2445c;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    /* Item rows */
    .item-row {
      display: flex;
      align-items: center;
      height: 48px;
    }
    .item-label {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 500;
      color: #323338;
      padding-right: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-track {
      flex: 1;
      position: relative;
      height: 100%;
    }
    .track-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e6e9ef;
    }
    .grid-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #f3f4f8;
    }
    .today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #e2445c;
      z-index: 3;
    }

    /* Dot + badge */
    .dot-wrapper {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      cursor: default;
    }
    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .dot-wrapper:hover .dot {
      transform: scale(1.5);
      box-shadow: 0 2px 8px rgba(0,0,0,0.28);
    }
    .conf-badge {
      position: absolute;
      bottom: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 3px;
      color: #fff;
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      background: #323338;
      color: #fff;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.1s;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      min-width: 190px;
    }
    #tooltip.show { opacity: 1; }
    .tt-name   { font-weight: 600; margin-bottom: 3px; }
    .tt-date   { color: #c5c7d4; font-size: 11px; margin-bottom: 6px; }
    .tt-conf   { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .tt-swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── Legend ── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #f0f1f5;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #676879;
    }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    /* ── States ── */
    .state-msg { padding: 48px; text-align: center; color: #676879; font-size: 14px; }
    .state-error {
      color: #d83a52;
      background: #fff0f2;
      border: 1px solid #f3b8c0;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 13px;
    }
    .state-error a { color: #d83a52; font-weight: 600; }

    /* ── Chart scroll wrapper ── */
    .chart-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .chart-inner { /* min-width set via JS */ }

    /* ── Mobile ── */
    @media (max-width: 680px) {
      .header {
        height: auto;
        min-height: 52px;
        padding: 10px 16px;
        flex-wrap: wrap;
        gap: 4px;
      }
      .header h1 { font-size: 16px; flex: 1 1 auto; }
      .header-actions { gap: 8px; }
      #next-refresh { display: none; }
      #last-updated { font-size: 11px; }
      .main-content { padding: 12px; }
      .card {
        padding: 14px 0 20px;
        overflow: visible;
      }
      .legend { padding: 12px 14px 0; margin-top: 12px; gap: 10px; }
      .dot { width: 18px; height: 18px; }
      .conf-badge { font-size: 8px; }
      #tooltip.mobile-show {
        position: fixed !important;
        left: 12px !important;
        right: 12px !important;
        bottom: 20px !important;
        top: auto !important;
        width: auto !important;
        min-width: unset !important;
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 14px;
        text-align: center;
      }
      #history-sidebar.open { width: 100vw; }
      .sidebar-inner { width: 100vw; }
    }
  </style>
</head>
<body>

<!-- Password Gate -->
<div id="password-gate" class="show">
  <div class="pw-box">
    <h2>Product Launch FCS Dates</h2>
    <p>Enter the password to view this page.</p>
    <input type="password" id="pw-input" placeholder="Password" autocomplete="off"
           onkeydown="if(event.key==='Enter')checkPassword()" />
    <div id="pw-error"></div>
    <button id="pw-submit" onclick="checkPassword()">View Chart</button>
  </div>
</div>

<!-- Token Modal -->
<div id="token-modal">
  <div class="modal-box">
    <h2>Connect to monday.com</h2>
    <p>Enter your monday.com API token to load live data.<br>
      Find it at <strong>brod-and-taylor.monday.com</strong> > Profile > Developers > API v2 Token.</p>
    <input type="password" id="token-input" placeholder="Paste your API token here..." autocomplete="off" />
    <button id="connect-btn" onclick="saveToken()">Connect</button>
  </div>
</div>

<!-- Header -->
<div class="header">
  <h1>Product Launch FCS Dates</h1>
  <div class="header-actions">
    <span id="last-updated"></span>
    <span id="next-refresh"></span>
    <button class="btn btn-ghost" onclick="clearToken()" style="display:none">⚙ API Token</button>
    <button class="btn btn-history" id="history-btn" onclick="toggleSidebar()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8z" fill="currentColor"/>
        <path d="M8 4a.75.75 0 0 1 .75.75v3.69l2.28 2.28a.75.75 0 1 1-1.06 1.06l-2.5-2.5A.75.75 0 0 1 7.25 8.75V4.75A.75.75 0 0 1 8 4z" fill="currentColor"/>
      </svg>
      Change History
    </button>
    <button class="btn btn-primary" id="refresh-btn" onclick="loadData(true)">Refresh</button>
  </div>
</div>

<!-- App body: chart + sidebar -->
<div class="app-body">
  <!-- Main chart -->
  <div class="main-content">
    <div class="card">
      <div id="chart-area">
        <div class="state-msg">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Change History Sidebar -->
  <div id="history-sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8z" fill="currentColor"/>
            <path d="M8 4a.75.75 0 0 1 .75.75v3.69l2.28 2.28a.75.75 0 1 1-1.06 1.06l-2.5-2.5A.75.75 0 0 1 7.25 8.75V4.75A.75.75 0 0 1 8 4z" fill="currentColor"/>
          </svg>
          Change History
        </div>
        <button class="sidebar-close" onclick="closeSidebar()" title="Close">✕</button>
      </div>

      <div class="sidebar-filters">
        <button class="filter-chip active" data-filter="all"        onclick="setFilter('all',this)">All</button>
        <button class="filter-chip"        data-filter="date"       onclick="setFilter('date',this)">FCS Date</button>
        <button class="filter-chip"        data-filter="confidence" onclick="setFilter('confidence',this)">Confidence</button>
      </div>

      <div class="sidebar-body" id="sidebar-body">
        <div class="sidebar-loading">Loading change history…</div>
      </div>
    </div>
  </div>
</div>

<!-- Tooltip -->
<div id="tooltip">
  <div class="tt-name"  id="tt-name"></div>
  <div class="tt-date"  id="tt-date"></div>
  <div class="tt-conf">
    <div class="tt-swatch" id="tt-swatch"></div>
    <span id="tt-conf-text"></span>
  </div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const BOARD_ID        = 18364310005;
const GROUP_ID        = 'topics';
const FCS_COL         = 'date_mm06txhj';
const CONF_COL        = 'numeric_mkz3rvnr';
const HISTORY_FILE    = './history.json';
const AUTO_REFRESH_MS = 5 * 60 * 1000;  // 5 minutes
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Columns tracked for diffing (history.json key → human title)
const TRACKED_COLS = {
  'date_mm06txhj':    'FCS Date',
  'numeric_mkz3rvnr': 'Confidence',
  'status':           'Priority',
  'color_mkxf9nhp':   'Action',
  'boolean_mm06c6vy': 'Pre-Tool Review',
  'boolean_mm06jadd': 'Post-Tool Review',
  'name':             'Name'
};

// ── Confidence colours ───────────────────────────────────────────────────────
function confColor(pct) {
  if (pct >= 90) return '#00c875';
  if (pct >= 75) return '#579bfc';
  if (pct >= 60) return '#fdab3d';
  return '#c4c4c4';
}
function confClass(pct) {
  if (pct >= 90) return 'conf-high';
  if (pct >= 75) return 'conf-mid';
  if (pct >= 60) return 'conf-low';
  return 'conf-vlow';
}

// ── Saved token ──────────────────────────────────────────────────────────────
const SAVED_TOKEN = '';

function getToken()  { return SAVED_TOKEN || localStorage.getItem('monday_token'); }
function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem('monday_token', t);
  document.getElementById('token-modal').classList.remove('open');
  loadData(true);
}
function clearToken() {
  localStorage.removeItem('monday_token');
  document.getElementById('token-input').value = '';
  document.getElementById('token-modal').classList.add('open');
}

// ── API ──────────────────────────────────────────────────────────────────────
// Fetch ALL items from ALL groups with ALL tracked columns.
// Returns full item list; chart rendering filters from this.
async function fetchItems(token) {
  const ALL_COLS = [FCS_COL, CONF_COL, 'status', 'color_mkxf9nhp', 'boolean_mm06c6vy', 'boolean_mm06jadd'];
  const colIds   = ALL_COLS.map(c => `"${c}"`).join(', ');

  const query = `{
    boards(ids: [${BOARD_ID}]) {
      groups {
        id title
        items_page(limit: 100) {
          items {
            id name
            column_values(ids: [${colIds}]) { id text }
          }
        }
      }
    }
  }`;

  const res = await fetch('https://api.monday.com/v2', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': token,
      'API-Version': '2024-01'
    },
    body: JSON.stringify({ query })
  });

  if (!res.ok) throw new Error(`HTTP ${res.status} - check your API token`);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors.map(e => e.message).join('; '));

  const allItems = [];
  for (const group of json.data.boards[0].groups) {
    for (const item of group.items_page.items) {
      const colMap = {};
      for (const cv of item.column_values) {
        colMap[cv.id] = cv.text || null;
      }
      allItems.push({
        id:          item.id,
        name:        item.name,
        group_id:    group.id,
        group_title: group.title,
        fcsDate:     colMap[FCS_COL]  || null,
        confidence:  colMap[CONF_COL] ? parseFloat(colMap[CONF_COL]) : null,
        colMap:      colMap
      });
    }
  }
  return allItems;
}

// ── Date helpers ─────────────────────────────────────────────────────────────
function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function prettyDate(s) {
  return parseDate(s).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
function monthStart(d, offset = 0) {
  return new Date(d.getFullYear(), d.getMonth() + offset, 1);
}
function isoNow() {
  return new Date().toISOString();
}
function formatChangeTime(isoStr) {
  const d = new Date(isoStr);
  const now = new Date();
  const diffMs = now - d;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHrs  = Math.floor(diffMs / 3600000);
  const diffDays = Math.floor(diffMs / 86400000);

  if (diffMins < 1)   return 'Just now';
  if (diffMins < 60)  return `${diffMins}m ago`;
  if (diffHrs  < 24)  return `${diffHrs}h ago`;
  if (diffDays < 7)   return `${diffDays}d ago`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: diffDays > 365 ? 'numeric' : undefined });
}

// ── Render chart ─────────────────────────────────────────────────────────────
function renderChart(items) {
  const area = document.getElementById('chart-area');

  if (!items.length) {
    area.innerHTML = '<div class="state-msg">No items with FCS dates found in the Active Developments group.</div>';
    return;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const allDates   = items.map(i => parseDate(i.fcsDate));
  const minDate    = new Date(Math.min(...allDates));
  const maxDate    = new Date(Math.max(...allDates));

  let rangeStart = monthStart(minDate, -1);
  let rangeEnd   = monthStart(maxDate,  2);
  if (today < rangeStart) rangeStart = monthStart(today, -1);
  if (today > rangeEnd)   rangeEnd   = monthStart(today,  2);

  const totalMs = rangeEnd - rangeStart;
  const pct = d => ((d - rangeStart) / totalMs) * 100;

  const monthList = [];
  let cur = new Date(rangeStart);
  while (cur < rangeEnd) {
    monthList.push(new Date(cur));
    cur = monthStart(cur, 1);
  }

  const isMobile = window.innerWidth < 680;
  const cvs = document.createElement('canvas');
  const ctx = cvs.getContext('2d');
  ctx.font = '500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  const maxLabel = isMobile ? 130 : 220;
  const minLabel = isMobile ? 90  : 120;
  const labelW = Math.min(maxLabel, Math.max(minLabel,
    Math.max(...items.map(i => ctx.measureText(i.name).width)) + 20
  ));

  const minChartWidth = Math.max(480, monthList.length * 80) + labelW;
  const todayPct  = pct(today);
  const showToday = todayPct >= 0 && todayPct <= 100;

  const monthTicksHtml = monthList.map(m => {
    const p     = pct(m);
    const label = (m.getMonth() === 0 || m === monthList[0])
      ? `${MONTHS[m.getMonth()]} ${m.getFullYear()}`
      : MONTHS[m.getMonth()];
    return `<div class="month-tick" style="left:${p}%">${label}</div>`;
  }).join('');

  const todayTickHtml = showToday
    ? `<div class="today-tick" style="left:${todayPct}%">Today</div>`
    : '';

  const gridHtml = monthList.map(m =>
    `<div class="grid-line" style="left:${pct(m)}%"></div>`
  ).join('');

  const todayLineHtml = showToday
    ? `<div class="today-line" style="left:${todayPct}%"></div>`
    : '';

  const rowsHtml = items.map(item => {
    const dp     = pct(parseDate(item.fcsDate));
    const color  = confColor(item.confidence ?? 0);
    const badge  = item.confidence != null ? item.confidence + '%' : '-';

    return `
      <div class="item-row">
        <div class="item-label" style="width:${labelW}px" title="${esc(item.name)}">${esc(item.name)}</div>
        <div class="item-track">
          <div class="track-line"></div>
          ${gridHtml}
          ${todayLineHtml}
          <div class="dot-wrapper"
            style="left:${dp}%"
            data-name="${esc(item.name)}"
            data-date="${esc(prettyDate(item.fcsDate))}"
            data-conf="${esc(badge)}"
            data-color="${color}"
            onmouseenter="showTip(event,this)"
            onmouseleave="hideTip()"
            onmousemove="moveTip(event)"
            onclick="tapTip(event,this)">
            <div class="conf-badge" style="background:${color}">${badge}</div>
            <div class="dot" style="background:${color}"></div>
          </div>
        </div>
      </div>`;
  }).join('');

  const legendHtml = `
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#00c875"></div>90-100%</div>
      <div class="legend-item"><div class="legend-dot" style="background:#579bfc"></div>75-89%</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fdab3d"></div>60-74%</div>
      <div class="legend-item"><div class="legend-dot" style="background:#c4c4c4"></div>&lt;60%</div>
      ${showToday ? '<div class="legend-item"><div style="width:14px;height:2px;background:#e2445c;border-radius:1px"></div>Today</div>' : ''}
    </div>`;

  area.innerHTML = `
    <div class="chart">
      <div class="chart-scroll">
        <div class="chart-inner" style="min-width:${minChartWidth}px; padding: 0 14px;">
          <div class="chart-header">
            <div class="label-spacer" style="width:${labelW}px"></div>
            <div class="months-bar">${monthTicksHtml}${todayTickHtml}</div>
          </div>
          <div class="item-rows">${rowsHtml}</div>
        </div>
      </div>
      ${legendHtml}
    </div>`;
}

// ── Tooltip ──────────────────────────────────────────────────────────────────
function showTip(e, el) {
  document.getElementById('tt-name').textContent      = el.dataset.name;
  document.getElementById('tt-date').textContent      = el.dataset.date;
  document.getElementById('tt-conf-text').textContent = 'Confidence: ' + el.dataset.conf;
  document.getElementById('tt-swatch').style.background = el.dataset.color;
  document.getElementById('tooltip').classList.add('show');
  moveTip(e);
}
function moveTip(e) {
  const tt = document.getElementById('tooltip');
  tt.style.left = Math.min(e.clientX + 16, window.innerWidth - 220) + 'px';
  tt.style.top  = Math.max(e.clientY - 10, 8) + 'px';
}
function hideTip() {
  const tt = document.getElementById('tooltip');
  tt.classList.remove('show');
  tt.classList.remove('mobile-show');
}

let tapTimer = null;
function tapTip(e, el) {
  if (window.innerWidth >= 680) return;
  e.stopPropagation();
  clearTimeout(tapTimer);
  document.getElementById('tt-name').textContent      = el.dataset.name;
  document.getElementById('tt-date').textContent      = el.dataset.date;
  document.getElementById('tt-conf-text').textContent = 'Confidence: ' + el.dataset.conf;
  document.getElementById('tt-swatch').style.background = el.dataset.color;
  const tt = document.getElementById('tooltip');
  tt.classList.add('show', 'mobile-show');
  tapTimer = setTimeout(hideTip, 3500);
}
document.addEventListener('click', () => {
  if (window.innerWidth < 680) hideTip();
});

// ── History & diffing ────────────────────────────────────────────────────────
let historyData  = null;   // parsed history.json
let activeFilter = 'all';  // 'all' | 'date' | 'confidence'

// Load history.json from the same origin
async function loadHistory() {
  try {
    const res = await fetch(HISTORY_FILE + '?_=' + Date.now());
    if (!res.ok) throw new Error('history.json not found');
    historyData = await res.json();
    renderSidebar();
  } catch (e) {
    document.getElementById('sidebar-body').innerHTML =
      `<div class="sidebar-empty">Could not load history.json.<br><small>${esc(e.message)}</small></div>`;
  }
}

// ── Snapshot helpers (localStorage) ─────────────────────────────────────────
// We store the most-recent live state here so every diff is incremental.
// This means A→B then B→C are two separate records, never collapsed into A→C.
const LS_SNAPSHOT_KEY = 'fcs_snapshot_v2';

function getStoredSnapshot() {
  try { return JSON.parse(localStorage.getItem(LS_SNAPSHOT_KEY) || 'null'); }
  catch(e) { return null; }
}

function storeSnapshot(allItems) {
  const snap = {};
  allItems.forEach(item => {
    snap[item.id] = Object.assign({ name: item.name, group_id: item.group_id }, item.colMap);
  });
  try { localStorage.setItem(LS_SNAPSHOT_KEY, JSON.stringify(snap)); } catch(e) {}
}

// Diff ALL live items (all groups, all fields) against the last stored snapshot.
// After diffing, the current state becomes the new snapshot.
function diffAndRecord(allItems) {
  if (!historyData) return;

  // Prefer localStorage snapshot (always up-to-date); fall back to history.json baseline
  let prevState = getStoredSnapshot();
  if (!prevState) {
    const snapshots = historyData.snapshots;
    if (snapshots && snapshots.length) {
      prevState = snapshots[snapshots.length - 1].items || {};
    }
  }

  const now       = isoNow();
  const changelog = historyData.changelog;
  const DIFF_FIELDS = [
    'date_mm06txhj', 'numeric_mkz3rvnr', 'status',
    'color_mkxf9nhp', 'boolean_mm06c6vy', 'boolean_mm06jadd', 'name'
  ];

  allItems.forEach(item => {
    const prev = prevState ? prevState[item.id] : null;
    if (!prev) return; // brand-new item — will be snapshotted, tracked next time

    const groupTitle = GROUP_NAMES[item.group_id] || item.group_title || item.group_id;

    DIFF_FIELDS.forEach(field => {
      const liveVal = (field === 'name') ? item.name : item.colMap[field];
      const snapVal = prev[field];

      const normSnap = (snapVal == null || snapVal === '') ? null : String(snapVal);
      const normLive = (liveVal == null || liveVal === '') ? null : String(liveVal);

      if (normSnap !== normLive) {
        // Dedupe: exact same transition already logged
        const isDupe = changelog.some(c =>
          c.itemId === item.id &&
          c.field  === field   &&
          c.from   === normSnap &&
          c.to     === normLive
        );
        if (!isDupe) {
          changelog.push({
            timestamp:  now,
            itemId:     item.id,
            itemName:   item.name,
            groupId:    item.group_id,
            groupTitle: groupTitle,
            field:      field,
            fieldTitle: TRACKED_COLS[field] || field,
            from:       normSnap,
            to:         normLive
          });
        }
      }
    });
  });

  // ⚠️ Update snapshot AFTER diffing so the next refresh diffs against NOW
  storeSnapshot(allItems);

  persistChangelogLocally(changelog);
  mergeLocalChangelog();
  renderSidebar();
}

const LS_CHANGELOG_KEY = 'fcs_changelog_v1';

function persistChangelogLocally(changelog) {
  try {
    localStorage.setItem(LS_CHANGELOG_KEY, JSON.stringify(changelog));
  } catch(e) { /* quota exceeded – ignore */ }
}

function mergeLocalChangelog() {
  if (!historyData) return;
  try {
    const local = JSON.parse(localStorage.getItem(LS_CHANGELOG_KEY) || '[]');
    const fileIds = new Set(historyData.changelog.map(c => c.timestamp + c.itemId + c.field));
    local.forEach(entry => {
      const key = entry.timestamp + entry.itemId + entry.field;
      if (!fileIds.has(key)) {
        historyData.changelog.push(entry);
        fileIds.add(key);
      }
    });
  } catch(e) { /* ignore */ }
}

const GROUP_NAMES = {
  'group_title':     'Concept Development',
  'group_mkxfjfcm':  'Product Upgrades / Cost Reductions',
  'topics':          'Active Developments',
  'group_mkxncbsv':  'Completed Developments',
  'group_mkxnn81v':  'Ideas'
};

// ── Sidebar render ───────────────────────────────────────────────────────────
function setFilter(filter, el) {
  activeFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderSidebar();
}

function renderSidebar() {
  if (!historyData) return;

  mergeLocalChangelog();

  const body = document.getElementById('sidebar-body');

  // Show all changes across all groups
  let entries = historyData.changelog.slice();

  if (activeFilter === 'date') {
    entries = entries.filter(c => c.field === 'date_mm06txhj');
  } else if (activeFilter === 'confidence') {
    entries = entries.filter(c => c.field === 'numeric_mkz3rvnr');
  }

  // Sort newest first
  entries = entries.slice().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));


  if (!entries.length) {
    body.innerHTML = `
      <div class="sidebar-empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <path d="M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20zM12 7v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        No changes recorded yet for<br>FCS Date or Confidence.<br>
        <small style="color:#c5c7d4;margin-top:6px;display:block">Changes appear here automatically<br>when data is refreshed.</small>
      </div>`;
    return;
  }

  body.innerHTML = entries.map(c => {
    let fromLabel, toLabel, toClass = '';
    if (c.field === 'date_mm06txhj') {
      fromLabel = c.from ? prettyDate(c.from) : '—';
      toLabel   = c.to   ? prettyDate(c.to)   : '—';
      toClass   = 'date-change';
    } else if (c.field === 'numeric_mkz3rvnr') {
      fromLabel = c.from != null ? c.from + '%' : '—';
      toLabel   = c.to   != null ? c.to   + '%' : '—';
      if (c.to) toClass = confClass(parseFloat(c.to));
    } else if (c.field === 'boolean_mm06c6vy' || c.field === 'boolean_mm06jadd') {
      fromLabel = c.from === 'true' ? '✓' : c.from === 'false' ? '✗' : c.from || '—';
      toLabel   = c.to   === 'true' ? '✓' : c.to   === 'false' ? '✗' : c.to   || '—';
    } else {
      fromLabel = c.from || '—';
      toLabel   = c.to   || '—';
    }

    return `
      <div class="change-entry">
        <div class="change-entry-header">
          <div class="change-item-name" title="${esc(c.itemName)}">${esc(c.itemName)}</div>
          <div class="change-time">${formatChangeTime(c.timestamp)}</div>
        </div>
        <div class="change-detail">
          <span class="change-field">${esc(c.fieldTitle)}</span>
          <span class="change-from">${esc(fromLabel)}</span>
          <span class="change-arrow">→</span>
          <span class="change-to ${toClass}">${esc(toLabel)}</span>
        </div>
        <div class="change-group">${esc(c.groupTitle)}</div>
      </div>`;
  }).join('');
}

// ── Sidebar toggle ───────────────────────────────────────────────────────────
function toggleSidebar() {
  const sidebar = document.getElementById('history-sidebar');
  const btn     = document.getElementById('history-btn');
  if (sidebar.classList.contains('open')) {
    sidebar.classList.remove('open');
    btn.classList.remove('active');
  } else {
    sidebar.classList.add('open');
    btn.classList.add('active');
    renderSidebar();
  }
}
function closeSidebar() {
  document.getElementById('history-sidebar').classList.remove('open');
  document.getElementById('history-btn').classList.remove('active');
}

// ── Load data + auto-refresh ─────────────────────────────────────────────────
let refreshTimer   = null;
let countdownTimer = null;
let nextRefreshAt  = null;

async function loadData(manual = false) {
  const token = getToken();
  if (!token) { document.getElementById('token-modal').classList.add('open'); return; }

  const btn = document.getElementById('refresh-btn');
  btn.disabled    = true;
  btn.textContent = 'Loading...';

  clearTimeout(refreshTimer);
  clearInterval(countdownTimer);
  document.getElementById('next-refresh').textContent = '';

  try {
    const allItems  = await fetchItems(token);

    // Chart only shows Active Developments items that have an FCS date
    const chartItems = allItems
      .filter(i => i.group_id === GROUP_ID && i.fcsDate)
      .sort((a, b) => new Date(a.fcsDate) - new Date(b.fcsDate));
    renderChart(chartItems);

    // Diff the full board (all groups, all fields) for the change history
    if (historyData) {
      diffAndRecord(allItems);
    }

    const now = new Date();
    document.getElementById('last-updated').textContent =
      'Updated ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    nextRefreshAt = Date.now() + AUTO_REFRESH_MS;
    refreshTimer  = setTimeout(() => loadData(), AUTO_REFRESH_MS);

    countdownTimer = setInterval(() => {
      const secs = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 1000));
      const m    = Math.floor(secs / 60);
      const s    = secs % 60;
      document.getElementById('next-refresh').textContent =
        `Next refresh ${m}:${String(s).padStart(2, '0')}`;
      if (secs === 0) clearInterval(countdownTimer);
    }, 1000);

  } catch (err) {
    document.getElementById('chart-area').innerHTML = `
      <div class="state-error">
        Failed to load data: ${esc(err.message)}.
        <a href="#" onclick="clearToken();return false">Re-enter API token</a>.
      </div>`;
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Refresh';
  }
}

// ── Utils ────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Init ─────────────────────────────────────────────────────────────────────
document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveToken();
});

// Load history.json on startup (no token needed)
loadHistory();

if (getToken()) {
  loadData();
} else {
  document.getElementById('token-modal').classList.add('open');
  document.getElementById('chart-area').innerHTML =
    '<div class="state-msg">Enter your monday.com API token to get started.</div>';
}

// ── Password gate ────────────────────────────────────────────────────────────
const PAGE_PASSWORD = 'btfcs';
function checkPassword() {
  const input = document.getElementById('pw-input');
  const errEl = document.getElementById('pw-error');
  if (input.value === PAGE_PASSWORD) {
    sessionStorage.setItem('page_unlocked', '1');
    document.getElementById('password-gate').classList.remove('show');
    input.classList.remove('error');
    errEl.textContent = '';
  } else {
    input.classList.add('error');
    errEl.textContent = 'Incorrect password. Please try again.';
    input.select();
  }
}
if (sessionStorage.getItem('page_unlocked') === '1') {
  document.getElementById('password-gate').classList.remove('show');
}
