<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Launch Dates</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f6f7fb;
      color: #323338;
    }
    /* ── Password Gate ── */
    #password-gate {
      display: none;
      position: fixed;
      inset: 0;
      background: #f6f7fb;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    #password-gate.show { display: flex; }
    .pw-box {
      background: #fff;
      border-radius: 12px;
      padding: 40px 36px 36px;
      width: 400px;
      max-width: calc(100vw - 48px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      text-align: center;
    }
    .pw-box h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .pw-box p  { color: #676879; font-size: 13px; margin-bottom: 24px; }
    #pw-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #c5c7d4;
      border-radius: 6px;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
      text-align: center;
      letter-spacing: 0.1em;
    }
    #pw-input:focus { border-color: #0073ea; box-shadow: 0 0 0 3px rgba(0,115,234,0.15); }
    #pw-input.error { border-color: #e2445c; box-shadow: 0 0 0 3px rgba(226,68,92,0.15); }
    #pw-error { color: #e2445c; font-size: 12px; min-height: 18px; margin-bottom: 10px; }
    #pw-submit {
      width: 100%;
      padding: 10px;
      background: #0073ea;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #pw-submit:hover { background: #0060c0; }
    /* ── Token Modal ── */
    #token-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #token-modal.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      width: 460px;
      max-width: calc(100vw - 48px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .modal-box h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .modal-box p  { color: #676879; font-size: 13px; line-height: 1.6; margin-bottom: 20px; }
    .modal-box a  { color: #0073ea; }
    #token-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #c5c7d4;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
      font-family: monospace;
      letter-spacing: 0.03em;
    }
    #token-input:focus { border-color: #0073ea; box-shadow: 0 0 0 3px rgba(0,115,234,0.15); }
    #connect-btn {
      width: 100%;
      padding: 10px;
      background: #0073ea;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #connect-btn:hover { background: #0060c0; }
    /* ── Header ── */
    .header {
      background: #fff;
      border-bottom: 1px solid #e6e9ef;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    #last-updated    { font-size: 12px; color: #676879; }
    #next-refresh    { font-size: 11px; color: #c5c7d4; }
    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }
    .btn-ghost   { background: transparent; border: 1px solid #c5c7d4; color: #676879; }
    .btn-ghost:hover { background: #f6f7fb; }
    .btn-primary { background: #0073ea; color: #fff; }
    .btn-primary:hover { background: #0060c0; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    /* ── History button badge ── */
    .btn-history {
      background: transparent;
      border: 1px solid #c5c7d4;
      color: #676879;
      position: relative;
    }
    .btn-history:hover { background: #f6f7fb; }
    .btn-history.active {
      background: #f0f7ff;
      border-color: #0073ea;
      color: #0073ea;
    }
    #history-badge {
      display: none;
      position: absolute;
      top: -5px;
      right: -5px;
      background: #e2445c;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      padding: 0 4px;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    #history-badge.show { display: flex; }
    /* ── Layout with sidebar ── */
    .app-body {
      display: flex;
      height: calc(100vh - 56px);
      overflow: hidden;
    }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      transition: margin-right 0.3s ease;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px 24px 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    /* ── History Sidebar ── */
    #history-sidebar {
      width: 0;
      overflow: hidden;
      background: #fff;
      border-left: 1px solid #e6e9ef;
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease;
      flex-shrink: 0;
    }
    #history-sidebar.open {
      width: 360px;
    }
    .sidebar-inner {
      width: 360px;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid #e6e9ef;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 15px;
      font-weight: 700;
      color: #323338;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-title svg { color: #676879; }
    .sidebar-close {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #676879;
      font-size: 16px;
      transition: background 0.15s;
    }
    .sidebar-close:hover { background: #f6f7fb; }
    /* Filter tabs inside sidebar */
    .sidebar-filters {
      display: flex;
      gap: 4px;
      padding: 10px 14px 8px;
      border-bottom: 1px solid #f0f1f5;
      flex-shrink: 0;
    }
    .filter-chip {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #e6e9ef;
      background: transparent;
      color: #676879;
      transition: all 0.12s;
    }
    .filter-chip:hover { border-color: #0073ea; color: #0073ea; }
    .filter-chip.active { background: #0073ea; border-color: #0073ea; color: #fff; }
    /* Sidebar body / log */
    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0 20px;
    }
    .sidebar-empty {
      padding: 40px 20px;
      text-align: center;
      color: #9699a6;
      font-size: 13px;
      line-height: 1.6;
    }
    .sidebar-empty svg {
      display: block;
      margin: 0 auto 12px;
      opacity: 0.3;
    }
    /* Change entry */
    .change-entry {
      padding: 10px 18px 10px;
      border-bottom: 1px solid #f3f4f8;
      cursor: default;
      transition: background 0.1s;
    }
    .change-entry:last-child { border-bottom: none; }
    .change-entry:hover { background: #fafbfd; }
    .change-entry-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .change-item-name {
      font-size: 12px;
      font-weight: 600;
      color: #323338;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .change-time {
      font-size: 10px;
      color: #9699a6;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .change-detail {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .change-field {
      font-size: 11px;
      font-weight: 600;
      color: #676879;
      background: #f3f4f8;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .change-arrow {
      font-size: 11px;
      color: #9699a6;
    }
    .change-from {
      font-size: 11px;
      color: #9699a6;
      text-decoration: line-through;
    }
    .change-to {
      font-size: 11px;
      font-weight: 600;
      color: #323338;
    }
    .change-to.conf-high   { color: #00843d; }
    .change-to.conf-mid    { color: #3d73ea; }
    .change-to.conf-low    { color: #c87400; }
    .change-to.conf-vlow   { color: #7a7a7a; }
    /* Date changes */
    .change-to.date-change { color: #0073ea; }
    .change-to.fcs-change  { color: rgb(160, 112, 64); }
    /* Group label pill */
    .change-group {
      font-size: 10px;
      color: #9699a6;
      margin-top: 3px;
    }
    /* Sidebar loading */
    .sidebar-loading {
      padding: 40px 20px;
      text-align: center;
      color: #9699a6;
      font-size: 12px;
    }
    /* ── Chart ── */
    .chart-header {
      display: flex;
      padding-bottom: 10px;
      border-bottom: 1px solid #e6e9ef;
      margin-bottom: 2px;
    }
    .label-spacer { flex-shrink: 0; }
    .months-bar   { position: relative; flex: 1; height: 22px; }
    .month-tick {
      position: absolute;
      font-size: 11px;
      font-weight: 600;
      color: #676879;
      transform: translateX(-50%);
      white-space: nowrap;
      user-select: none;
      bottom: 0;
    }
    .today-tick {
      position: absolute;
      bottom: 0;
      font-size: 10px;
      font-weight: 700;
      color: #e2445c;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    /* Item rows */
    .item-row {
      display: flex;
      align-items: center;
      height: 48px;
    }
    .item-label {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 500;
      color: #323338;
      padding-right: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-track {
      flex: 1;
      position: relative;
      height: 100%;
    }
    .track-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e6e9ef;
    }
    .grid-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #f3f4f8;
    }
    .today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #e2445c;
      z-index: 3;
    }
    /* Dot + badge */
    .dot-wrapper {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      cursor: default;
    }
    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .dot-wrapper-fcs { z-index: 4; }
    .dot-wrapper:hover .dot {
      transform: scale(1.5);
      box-shadow: 0 2px 8px rgba(0,0,0,0.28);
    }
    .conf-badge {
      position: absolute;
      bottom: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 3px;
      color: #fff;
      white-space: nowrap;
      pointer-events: none;
    }
    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      background: #323338;
      color: #fff;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.1s;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      min-width: 190px;
    }
    #tooltip.show { opacity: 1; }
    .tt-name   { font-weight: 600; margin-bottom: 3px; }
    .tt-date   { color: #c5c7d4; font-size: 11px; margin-bottom: 6px; }
    .tt-conf   { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .tt-swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    /* ── Legend ── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #f0f1f5;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #676879;
    }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    /* ── Secondary roadmap section (Product Upgrades / Cost Reductions) ── */
    .roadmap-secondary {
      margin-top: 14px;
      padding: 12px 14px 4px;
      background: #f2f3f7;
      border: 1px solid #e6e9ef;
      border-radius: 10px;
    }
    .roadmap-secondary-label {
      font-size: 11px;
      font-weight: 700;
      color: #9699a6;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
      padding-left: 2px;
    }
    .dot-wrapper-secondary .dot { border-color: #dfe2ec; }
    /* ── States ── */
    .state-msg { padding: 48px; text-align: center; color: #676879; font-size: 14px; }
    .state-error {
      color: #d83a52;
      background: #fff0f2;
      border: 1px solid #f3b8c0;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 13px;
    }
    .state-error a { color: #d83a52; font-weight: 600; }
    /* ── Chart scroll wrapper ── */
    .chart-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .chart-inner { /* min-width set via JS */ }
    /* ── View tabs ── */
    .view-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      border-bottom: 2px solid #e6e9ef;
    }
    .view-tab {
      padding: 8px 20px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      font-size: 14px;
      font-weight: 500;
      color: #676879;
      cursor: pointer;
      transition: all 0.15s;
    }
    .view-tab:hover { color: #323338; }
    .view-tab.active {
      color: #0073ea;
      border-bottom-color: #0073ea;
      font-weight: 700;
    }
    /* ── Timeline bar chart ── */
    .tl-bar-wrap {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 20px;
      border-radius: 5px;
      overflow: visible;
      pointer-events: none;
    }
    .tl-bar-fill {
      position: absolute;
      inset: 0;
      border-radius: 5px;
    }
    .tl-dur-label {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .tl-section-row {
      display: flex;
      align-items: center;
      height: 32px;
      background: #f6f7fb;
      border-bottom: 1px solid #e6e9ef;
      border-top: 1px solid #e6e9ef;
      margin-top: 4px;
    }
    .tl-section-label {
      font-size: 11px;
      font-weight: 700;
      color: #9699a6;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      flex-shrink: 0;
      padding-right: 14px;
    }
    /* ── Mobile ── */
    @media (max-width: 680px) {
      .header {
        height: auto;
        min-height: 52px;
        padding: 10px 16px;
        flex-wrap: wrap;
        gap: 4px;
      }
      .header h1 { font-size: 16px; flex: 1 1 auto; }
      .header-actions { gap: 8px; }
      #next-refresh { display: none; }
      #last-updated { font-size: 11px; }
      .main-content { padding: 12px; }
      .card {
        padding: 14px 0 20px;
        overflow: visible;
      }
      .legend { padding: 12px 14px 0; margin-top: 12px; gap: 10px; }
      .dot { width: 18px; height: 18px; }
      .conf-badge { font-size: 8px; }
      #tooltip.mobile-show {
        position: fixed !important;
        left: 12px !important;
        right: 12px !important;
        bottom: 20px !important;
        top: auto !important;
        width: auto !important;
        min-width: unset !important;
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 14px;
        text-align: center;
      }
      #history-sidebar.open { width: 100vw; }
      .sidebar-inner { width: 100vw; }
    }
  </style>
</head>
<body>
<!-- Password Gate -->
<div id="password-gate" class="show">
  <div class="pw-box">
    <h2>Product Launch Dates</h2>
    <p>Enter the password to view this page.</p>
    <input type="password" id="pw-input" placeholder="Password" autocomplete="off"
           onkeydown="if(event.key==='Enter')checkPassword()" />
    <div id="pw-error"></div>
    <button id="pw-submit" onclick="checkPassword()">View Chart</button>
  </div>
</div>
<!-- Token Modal -->
<div id="token-modal">
  <div class="modal-box">
    <h2>Connect to monday.com</h2>
    <p>Enter your monday.com API token to load live data.<br>
      Find it at <strong>brod-and-taylor.monday.com</strong> > Profile > Developers > API v2 Token.</p>
    <input type="password" id="token-input" placeholder="Paste your API token here..." autocomplete="off" />
    <button id="connect-btn" onclick="saveToken()">Connect</button>
  </div>
</div>
<!-- Header -->
<div class="header">
  <h1>Product Launch Dates</h1>
  <div class="header-actions">
    <span id="last-updated"></span>
    <span id="next-refresh"></span>
    <button class="btn btn-ghost" onclick="clearToken()" style="display:none">⚙ API Token</button>
    <button class="btn btn-history" id="history-btn" onclick="toggleSidebar()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8z" fill="currentColor"/>
        <path d="M8 4a.75.75 0 0 1 .75.75v3.69l2.28 2.28a.75.75 0 1 1-1.06 1.06l-2.5-2.5A.75.75 0 0 1 7.25 8.75V4.75A.75.75 0 0 1 8 4z" fill="currentColor"/>
      </svg>
      Change History
    </button>
    <button class="btn btn-primary" id="refresh-btn" onclick="loadData(true)">Refresh</button>
  </div>
</div>
<!-- App body: chart + sidebar -->
<div class="app-body">
  <!-- Main content -->
  <div class="main-content">
    <!-- View tabs -->
    <div class="view-tabs">
      <button class="view-tab active" id="tab-roadmap"  onclick="switchView('roadmap')">Roadmap</button>
      <button class="view-tab"        id="tab-timeline" onclick="switchView('timeline')">Timeline</button>
    </div>
    <!-- Roadmap view -->
    <div id="view-roadmap">
      <div class="card">
        <div id="chart-area">
          <div class="state-msg">Loading...</div>
        </div>
      </div>
    </div>
    <!-- Timeline view -->
    <div id="view-timeline" style="display:none">
      <div class="card">
        <div id="timeline-area">
          <div class="state-msg">Loading…</div>
        </div>
      </div>
    </div>
  </div>
  <!-- Change History Sidebar -->
  <div id="history-sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8z" fill="currentColor"/>
            <path d="M8 4a.75.75 0 0 1 .75.75v3.69l2.28 2.28a.75.75 0 1 1-1.06 1.06l-2.5-2.5A.75.75 0 0 1 7.25 8.75V4.75A.75.75 0 0 1 8 4z" fill="currentColor"/>
          </svg>
          Change History
        </div>
        <button class="sidebar-close" onclick="closeSidebar()" title="Close">✕</button>
      </div>
      <div class="sidebar-filters">
        <button class="filter-chip active" data-filter="all"        onclick="setFilter('all',this)">All</button>
        <button class="filter-chip"        data-filter="date"       onclick="setFilter('date',this)">FFS Date</button>
        <button class="filter-chip"        data-filter="fcs"        onclick="setFilter('fcs',this)">FCS Date</button>
        <button class="filter-chip"        data-filter="confidence" onclick="setFilter('confidence',this)">Confidence</button>
      </div>
      <div class="sidebar-body" id="sidebar-body">
        <div class="sidebar-loading">Loading change history…</div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const BOARD_ID        = 18364310005;

// ── Confidence colours ───────────────────────────────────────────────────────
function confColor(pct) {
  if (pct >= 100) return '#00c875';
  if (pct >= 90) return '#66d9a3';
  if (pct >= 75) return '#579bfc';
  if (pct >= 60) return '#fdab3d';

}
function confClass(pct) {

}

// ── API ──────────────────────────────────────────────────────────────────────
// Fetch ALL items from ALL groups with ALL tracked columns.
// Returns full item list; chart rendering filters from this.
async function fetchItems(token) {
  const ALL_COLS = [FFS_COL, CONF_COL, 'status', 'color_mkxf9nhp', 'boolean_mm06c6vy', 'boolean_mm06jadd'];
  const colIds   = ALL_COLS.map(c => `"${c}"`).join(', ');
  const query = `{
    boards(ids: [${BOARD_ID}]) {
      groups {
        id title
        items_page(limit: 100) {
          items {
            id name created_at
            column_values(ids: [${colIds}]) { id text }
          }
        }
      }
    }
  }`;
  const res = await fetch('https://api.monday.com/v2', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': token,
      'API-Version': '2024-01'
    },
    body: JSON.stringify({ query })
  });
  if (!res.ok) throw new Error(`HTTP ${res.status} - check your API token`);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors.map(e => e.message).join('; '));
  const allItems = [];
  for (const group of json.data.boards[0].groups) {
    for (const item of group.items_page.items) {
      const colMap = {};
      for (const cv of item.column_values) {
        colMap[cv.id] = cv.text || null;
      }
      allItems.push({
        id:          item.id,
        name:        item.name,
        group_id:    group.id,
        group_title: group.title,
        ffsDate:     colMap[FFS_COL]  || null,
        confidence:  colMap[CONF_COL] ? parseFloat(colMap[CONF_COL]) : null,
        createdAt:   item.created_at || null,
        colMap:      colMap
      });
    }
  }
  return allItems;
}
// ── GTM Launches (FCS dates) ─────────────────────────────────────────────────
// Product names are matched across boards ignoring case, spacing & punctuation.
function normName(s) { return (s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
// monday.com date column text is "YYYY-MM-DD" (optionally followed by a time)
function isoFromText(t) { const m = (t || '').match(/\d{4}-\d{2}-\d{2}/); return m ? m[0] : null; }
async function fetchGtmFcsDates(token) {
  const query = `{
    boards(ids: [${GTM_BOARD_ID}]) {
      columns { id title type }
      items_page(limit: 500) {
        items { name column_values { id text } }
      }
    }
  }`;
  const res = await fetch('https://api.monday.com/v2', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': token, 'API-Version': '2024-01' },
    body: JSON.stringify({ query })
  });
  if (!res.ok) throw new Error(`GTM board HTTP ${res.status}`);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors.map(e => e.message).join('; '));
  const board = json.data.boards[0];
  if (!board) throw new Error('GTM Launches board not accessible with this token');
  const dateCols = board.columns.filter(c => c.type === 'date');
  const fcsCol = dateCols.find(c => c.id === GTM_FCS_COL) || dateCols.find(c => /fcs/i.test(c.title));
  if (!fcsCol) throw new Error('No FCS date column found on GTM Launches board');
  const map = {};
  for (const item of board.items_page.items) {
    const cv = item.column_values.find(c => c.id === fcsCol.id);
    const d = cv && isoFromText(cv.text);
    if (d) map[normName(item.name)] = d;
  }
  return map;
}
// ── Date helpers ─────────────────────────────────────────────────────────────
function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function prettyDate(s) {
  return parseDate(s).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
function monthStart(d, offset = 0) {
  return new Date(d.getFullYear(), d.getMonth() + offset, 1);
}
function isoNow() {
  return new Date().toISOString();
}
function formatChangeTime(isoStr) {
  const d = new Date(isoStr);
  const now = new Date();
  const diffMs = now - d;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHrs  = Math.floor(diffMs / 3600000);
  const diffDays = Math.floor(diffMs / 86400000);
  if (diffMins < 1)   return 'Just now';
  if (diffMins < 60)  return `${diffMins}m ago`;
  if (diffHrs  < 24)  return `${diffHrs}h ago`;
  if (diffDays < 7)   return `${diffDays}d ago`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: diffDays > 365 ? 'numeric' : undefined });
}
// ── Render chart ─────────────────────────────────────────────────────────────
function renderChart(items, secondaryItems = []) {
  const area = document.getElementById('chart-area');
  if (!items.length) {
    area.innerHTML = '<div class="state-msg">No items with FFS dates found in the Active Developments group.</div>';
    return;
  }
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  // Include secondary-section dates in the range so items in the
  // Product Upgrades / Cost Reductions block below always fit on the same axis.
  const allDates = items.concat(secondaryItems)
    .flatMap(i => [i.ffsDate, i.fcsDate].filter(Boolean))
    .map(parseDate);
  const maxDate  = new Date(Math.max(...allDates));
  // Always start 1 month before today; end 2 months after latest FFS
  const rangeStart = monthStart(today, -1);
  const rangeEnd   = monthStart(maxDate, 2);
  const totalMs = rangeEnd - rangeStart;
  const pct = d => ((d - rangeStart) / totalMs) * 100;
  const monthList = [];
  let cur = new Date(rangeStart);
  while (cur < rangeEnd) {
    monthList.push(new Date(cur));

    Math.max(...items.concat(secondaryItems).map(i => ctx.measureText(i.name).width)) + 20
  ));
  const minChartWidth = Math.max(480, monthList.length * 80) + labelW;
  const monthTicksHtml = monthList.map(m => {
    const p     = pct(m);
    const label = (m.getMonth() === 0 || m === monthList[0])
      ? `${MONTHS[m.getMonth()]} ${m.getFullYear()}`
      : MONTHS[m.getMonth()];
    return `<div class="month-tick" style="left:${p}%">${label}</div>`;
  }).join('');
  const gridHtml = monthList.map(m =>
    `<div class="grid-line" style="left:${pct(m)}%"></div>`
  ).join('');
  // secondary=true gives the dot a subtly different border color (matching the
  // gray section background) so the second block reads as visually distinct.
  function dotRowHtml(item, secondary) {
    const dp     = pct(parseDate(item.ffsDate));
    const color  = confColor(item.confidence ?? 0);
    const badge  = item.confidence != null ? item.confidence + '%' : '-';
    const dotCls = secondary ? 'dot-wrapper dot-wrapper-secondary' : 'dot-wrapper';
    return `
      <div class="item-row">
        <div class="item-label" style="width:${labelW}px" title="${esc(item.name)}">${esc(item.name)}</div>
        <div class="item-track">

          ${gridHtml}
          <div class="${dotCls}"
            style="left:${dp}%"
            data-name="${esc(item.name)}"
            data-date="${esc(prettyDate(item.ffsDate))}"
            data-conf="${esc(badge)}"
            data-color="${color}"
            onmouseenter="showTip(event,this)"
            onmouseleave="hideTip()"
            onmousemove="moveTip(event)"
            onclick="tapTip(event,this)">
            <div class="conf-badge" style="background:${color}">${badge}</div>
            <div class="dot" style="background:${color}"></div>
          </div>
          ${item.fcsDate ? `
          <div class="${dotCls} dot-wrapper-fcs"
            style="left:${pct(parseDate(item.fcsDate))}%"
            data-name="${esc(item.name)}"
            data-date="${esc(prettyDate(item.fcsDate))}"
            data-label="FCS (GTM Launches)"
            data-color="${FCS_COLOR}"
            onmouseenter="showTip(event,this)"
            onmouseleave="hideTip()"
            onmousemove="moveTip(event)"
            onclick="tapTip(event,this)">
            <div class="conf-badge" style="background:${FCS_COLOR}">FCS</div>
            <div class="dot" style="background:${FCS_COLOR}"></div>
          </div>` : ''}
        </div>
      </div>`;
  }
  const rowsHtml = items.map(item => dotRowHtml(item, false)).join('');
  const secondaryRowsHtml = secondaryItems.length
    ? secondaryItems.map(item => dotRowHtml(item, true)).join('')
    : '<div class="state-msg" style="padding:16px 4px;font-size:12px;">No items with an FFS date yet.</div>';
  const legendHtml = `
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#00c875"></div>100%</div>
      <div class="legend-item"><div class="legend-dot" style="background:#66d9a3"></div>90-99%</div>
      <div class="legend-item"><div class="legend-dot" style="background:#579bfc"></div>75-89%</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fdab3d"></div>60-74%</div>
      <div class="legend-item"><div class="legend-dot" style="background:#c4c4c4"></div>&lt;60%</div>
      <div class="legend-item"><div class="legend-dot" style="background:${FCS_COLOR}"></div>FCS (GTM Launches)</div>
    </div>`;
  area.innerHTML = `
    <div class="chart">
      <div class="chart-scroll">
        <div class="chart-inner" style="min-width:${minChartWidth}px; padding: 0 14px;">
          <div class="chart-header">
            <div class="label-spacer" style="width:${labelW}px"></div>
            <div class="months-bar">${monthTicksHtml}</div>
          </div>
          <div class="item-rows">${rowsHtml}</div>
          <div class="roadmap-secondary">
            <div class="roadmap-secondary-label">${esc(GROUP_NAMES[UPGRADES_GROUP_ID] || 'Product Upgrades')}</div>
            <div class="item-rows">${secondaryRowsHtml}</div>
          </div>
        </div>
      </div>
      ${legendHtml}

}
// ── Tooltip ──────────────────────────────────────────────────────────────────
function showTip(e, el) {
  document.getElementById('tt-name').textContent      = el.dataset.name;
  document.getElementById('tt-date').textContent      = el.dataset.date;
  document.getElementById('tt-conf-text').textContent = el.dataset.label || ('FFS · Confidence: ' + el.dataset.conf);
  document.getElementById('tt-swatch').style.background = el.dataset.color;
  document.getElementById('tooltip').classList.add('show');
  moveTip(e);
}
function moveTip(e) {
  const tt = document.getElementById('tooltip');
  tt.style.left = Math.min(e.clientX + 16, window.innerWidth - 220) + 'px';
  tt.style.top  = Math.max(e.clientY - 10, 8) + 'px';
}
function hideTip() {
  const tt = document.getElementById('tooltip');
  tt.classList.remove('show');
  tt.classList.remove('mobile-show');
}
let tapTimer = null;
function tapTip(e, el) {
  if (window.innerWidth >= 680) return;

  clearTimeout(tapTimer);
  document.getElementById('tt-name').textContent      = el.dataset.name;
  document.getElementById('tt-date').textContent      = el.dataset.date;
  document.getElementById('tt-conf-text').textContent = el.dataset.label || ('FFS · Confidence: ' + el.dataset.conf);
  document.getElementById('tt-swatch').style.background = el.dataset.color;

// ── Timeline Data ────────────────────────────────────────────────────────────
// Entry dates into Active Developments (actual development start dates)
const ACTIVE_ENTRY_DATES = {
  '18364450778': '2025-03-20', // Bread Knife
  '18364451333': '2025-07-17', // Bread Lame
  '18364459284': '2025-10-10', // Sourdough Home Plus

let currentView = 'roadmap';
function switchView(view) {

// ── Timeline render ───────────────────────────────────────────────────────────
function renderTimeline(allItems) {
  const area = document.getElementById('timeline-area');
  if (!area || currentView !== 'timeline') return;
  // Mirrors the Roadmap chart's item set exactly (Active Developments, has an FFS
  // date) so every item on the Roadmap automatically shows up here too — no
  // manual per-item setup required. If we have a confirmed dev-start date in
  // ACTIVE_ENTRY_DATES we use it; otherwise we fall back to the item's
  // created_at from monday.com so new items still populate automatically.
  const activeRows = allItems
    .filter(i => i.group_id === GROUP_ID && i.ffsDate)
    .map(i => {
      const entry = ACTIVE_ENTRY_DATES[i.id] || (i.createdAt ? i.createdAt.slice(0, 10) : i.ffsDate);
      return {
        name:   i.name,
        entry:  entry,
        ffs:    i.ffsDate,
        months: Math.max((parseDate(i.ffsDate) - parseDate(entry)) / (1000*60*60*24*30.44), 0),
      };
    })
    .sort((a, b) => parseDate(a.ffs) - parseDate(b.ffs));
  if (!activeRows.length) {
    area.innerHTML = '<div class="state-msg">No timeline data available.</div>';
    return;
  }
  // ── Date range ──────────────────────────────────────────────────────────
  const ffsDates   = activeRows.map(r => parseDate(r.ffs));
  const entryDates = activeRows.map(r => parseDate(r.entry));
  const maxDate    = new Date(Math.max(...ffsDates));
  const minEntry   = new Date(Math.min(...entryDates));
  // Start 1 month before earliest entry; end 2 months after latest FFS
  const rangeStart = monthStart(minEntry, -1);
  const rangeEnd   = monthStart(maxDate, 2);
  const totalMs    = rangeEnd - rangeStart;
  const pct = d => ((d - rangeStart) / totalMs) * 100;
  // Month list — only label every other month to avoid crowding on a full-page view
  const monthList = [];
  let cur = new Date(rangeStart);
  while (cur < rangeEnd) { monthList.push(new Date(cur)); cur = monthStart(cur, 1); }
  // Show every 2nd month tick if span > 18 months, every 3rd if > 27
  const span = monthList.length;
  const tickEvery = span > 27 ? 3 : span > 18 ? 2 : 1;
  // Label column width (fixed, no canvas measurement needed for a clean fit)
  const labelW = 175;
  const monthTicksHtml = monthList.map((m, idx) => {
    if (idx % tickEvery !== 0) return '';
    const p     = pct(m);
    const label = (m.getMonth() === 0 || m === monthList[0])
      ? `${MONTHS[m.getMonth()]} '${String(m.getFullYear()).slice(2)}` : MONTHS[m.getMonth()];
    return `<div class="month-tick" style="left:${p}%">${label}</div>`;
  }).join('');
  const gridHtml = monthList.map(m =>
    `<div class="grid-line" style="left:${pct(m)}%"></div>`
  ).join('');
  // ── Bar row ────────────────────────────────────────────────────────────
  function barRowHtml(row) {
    const startPct = pct(parseDate(row.entry));
    const endPct   = pct(parseDate(row.ffs));
    const widthPct = Math.max(endPct - startPct, 0.5);
    const durLabel = row.months.toFixed(1) + ' mo';
    const labelInside = widthPct > 8;
    const labelHtml = labelInside
      ? `<span class="tl-dur-label" style="right:7px;color:#fff;">${esc(durLabel)}</span>`
      : `<span class="tl-dur-label" style="left:calc(100% + 5px);color:#0073ea;">${esc(durLabel)}</span>`;
    return `
      <div class="item-row">
        <div class="item-label" style="width:${labelW}px" title="${esc(row.name)}">${esc(row.name)}</div>
        <div class="item-track">
          <div class="track-line"></div>
          ${gridHtml}
          <div class="tl-bar-wrap" style="left:${startPct}%;width:${widthPct}%;">
            <div class="tl-bar-fill" style="background:#0073ea;opacity:0.88;"></div>
            ${labelHtml}
          </div>
        </div>
      </div>`;
  }
  const rowsHtml = activeRows.map(barRowHtml).join('');
  area.innerHTML = `
    <div class="chart" style="padding:0 14px;">
      <div class="chart-header">
        <div class="label-spacer" style="width:${labelW}px"></div>
        <div class="months-bar">${monthTicksHtml}</div>
      </div>
      <div class="item-rows">${rowsHtml}</div>
    </div>`;
}
// ── History & diffing ────────────────────────────────────────────────────────
let historyData  = null;   // parsed history.json
let activeFilter = 'all';   // 'all' | 'date' | 'fcs' | 'confidence'
// history.json is the single source of truth for the change history. It is
// rebuilt from monday.com activity logs (exact time + author of every change)
// by scripts/update_history.py, which a GitHub Action runs every hour and
// commits back to the repo. The page only reads it — no browser-side diffing.
async function loadHistory() {
  try {
    const res = await fetch(HISTORY_FILE + '?_=' + Date.now());
    if (!res.ok) throw new Error('history.json not found');
    historyData = await res.json();
    renderSidebar();
  } catch (e) {
    document.getElementById('sidebar-body').innerHTML =
      `<div class="sidebar-empty">Could not load history.json.<br><small>${esc(e.message)}</small></div>`;
  }
}
const GROUP_NAMES = {

  'group_mkxfjfcm':  'Product Upgrades',
  'topics':          'Active Developments',
  'group_mkxncbsv':  'Completed Developments',

function renderSidebar() {

  let entries = historyData.changelog.slice();
  if (activeFilter === 'date') {
    entries = entries.filter(c => c.field === 'date_mm06txhj');
  } else if (activeFilter === 'fcs') {
    entries = entries.filter(c => c.field === 'fcs_date');
  } else if (activeFilter === 'confidence') {
    entries = entries.filter(c => c.field === 'numeric_mkz3rvnr');
  }
  // Sort newest first
  entries = entries.slice().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  if (!entries.length) {
    body.innerHTML = `
      <div class="sidebar-empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <path d="M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20zM12 7v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        No changes recorded yet.<br>
        <small style="color:#c5c7d4;margin-top:6px;display:block">History syncs from monday.com<br>every hour.</small>
      </div>`;
    return;
  }
  body.innerHTML = entries.map(c => {
    let fromLabel, toLabel, toClass = '';
    if (c.field === '_added') {
      fromLabel = null;
      toLabel   = c.to || '—';
    } else if (c.field === '_group') {
      fromLabel = c.from || '—';
      toLabel   = c.to   || '—';
    } else if (c.field === 'date_mm06txhj') {
      fromLabel = c.from ? prettyDate(c.from) : '—';

      toClass   = 'date-change';

      fromLabel = c.from ? prettyDate(c.from) : '—';
      toLabel   = c.to   ? prettyDate(c.to)   : '—';
      toClass   = 'fcs-change';
    } else if (c.field === '_deleted') {
      fromLabel = null;
      toLabel   = c.to || 'Deleted';
    } else if (c.field === 'numeric_mkz3rvnr') {
      fromLabel = c.from != null ? c.from + '%' : '—';
      toLabel   = c.to   != null ? c.to   + '%' : '—';
      if (c.to) toClass = confClass(parseFloat(c.to));
    } else if (c.field === 'boolean_mm06c6vy' || c.field === 'boolean_mm06jadd') {
      fromLabel = c.from === 'true' ? '✓' : c.from === 'false' ? '✗' : c.from || '—';
      toLabel   = c.to   === 'true' ? '✓' : c.to   === 'false' ? '✗' : c.to   || '—';
    } else {
      fromLabel = c.from || '—';
      toLabel   = c.to   || '—';
    }
    return `
      <div class="change-entry">
        <div class="change-entry-header">
          <div class="change-item-name" title="${esc(c.itemName)}">${esc(c.itemName)}</div>
          <div class="change-time">${formatChangeTime(c.timestamp)}</div>
        </div>
        <div class="change-detail">
          <span class="change-field">${esc(c.fieldTitle)}</span>
          ${fromLabel != null ? `<span class="change-from">${esc(fromLabel)}</span><span class="change-arrow">→</span>` : ''}
          <span class="change-to ${toClass}">${esc(toLabel)}</span>
        </div>
        <div class="change-group">${esc(c.groupTitle || '')}${c.changedBy ? ' · ' + esc(c.changedBy) : ''}</div>
      </div>`;
  }).join('');
}
// ── Sidebar toggle ───────────────────────────────────────────────────────────
function toggleSidebar() {
  const sidebar = document.getElementById('history-sidebar');
  const btn     = document.getElementById('history-btn');
  if (sidebar.classList.contains('open')) {
    sidebar.classList.remove('open');
    btn.classList.remove('active');
  } else {
    sidebar.classList.add('open');
    btn.classList.add('active');
    renderSidebar();
  }
}
function closeSidebar() {
  document.getElementById('history-sidebar').classList.remove('open');
  document.getElementById('history-btn').classList.remove('active');
}
// ── Load data + auto-refresh ─────────────────────────────────────────────────
let refreshTimer   = null;
let countdownTimer = null;
let nextRefreshAt  = null;
async function loadData(manual = false) {
  const token = getToken();
  if (!token) { document.getElementById('token-modal').classList.add('open'); return; }
  const btn = document.getElementById('refresh-btn');
  btn.disabled    = true;
  btn.textContent = 'Loading...';
  clearTimeout(refreshTimer);
  clearInterval(countdownTimer);
  document.getElementById('next-refresh').textContent = '';
  try {
    const [allItems, gtmMap] = await Promise.all([
      fetchItems(token),
      fetchGtmFcsDates(token).catch(err => { console.warn('FCS dates unavailable:', err.message); return {}; })
    ]);
    for (const i of allItems) i.fcsDate = gtmMap[normName(GTM_NAME_ALIASES[i.name] || i.name)] || null;
    // Main roadmap: Active Developments items that have an FFS date
    const chartItems = allItems
      .filter(i => i.group_id === GROUP_ID && i.ffsDate)
      .sort((a, b) => parseDate(a.fcsDate || a.ffsDate) - parseDate(b.fcsDate || b.ffsDate));
    // Secondary roadmap block: Product Upgrades / Cost Reductions items with an FFS date
    const upgradeItems = allItems
      .filter(i => i.group_id === UPGRADES_GROUP_ID && i.ffsDate)
      .sort((a, b) => parseDate(a.fcsDate || a.ffsDate) - parseDate(b.fcsDate || b.ffsDate));
    renderChart(chartItems, upgradeItems);
    // Update shared cache; render whichever secondary views are active
    liveItemsCache = allItems;
    renderTimeline(allItems);
    // Pick up the latest synced change history
    loadHistory();
    const now = new Date();
    document.getElementById('last-updated').textContent =
      'Updated ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    nextRefreshAt = Date.now() + AUTO_REFRESH_MS;
    refreshTimer  = setTimeout(() => loadData(), AUTO_REFRESH_MS);
    countdownTimer = setInterval(() => {
      const secs = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 1000));
      const m    = Math.floor(secs / 60);
      const s    = secs % 60;
      document.getElementById('next-refresh').textContent =
        `Next refresh ${m}:${String(s).padStart(2, '0')}`;
      if (secs === 0) clearInterval(countdownTimer);
    }, 1000);
  } catch (err) {
    document.getElementById('chart-area').innerHTML = `
      <div class="state-error">
        Failed to load data: ${esc(err.message)}.
        <a href="#" onclick="clearToken();return false">Re-enter API token</a>.
      </div>`;
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Refresh';
  }
}
// ── Utils ────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
// ── Init ─────────────────────────────────────────────────────────────────────
document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveToken();
});
// Load history.json on startup (no token needed)
loadHistory();
if (getToken()) {
  loadData();
} else {
  document.getElementById('token-modal').classList.add('open');
  document.getElementById('chart-area').innerHTML =
    '<div class="state-msg">Enter your monday.com API token to get started.</div>';
}
// ── Password gate ────────────────────────────────────────────────────────────
const PAGE_PASSWORD = 'btfcs';
function checkPassword() {
  const input = document.getElementById('pw-input');
  const errEl = document.getElementById('pw-error');
  if (input.value === PAGE_PASSWORD) {
    sessionStorage.setItem('page_unlocked', '1');
    document.getElementById('password-gate').classList.remove('show');
    input.classList.remove('error');
    errEl.textContent = '';
  } else {
    input.classList.add('error');
    errEl.textContent = 'Incorrect password. Please try again.';
    input.select();
  }
}
if (sessionStorage.getItem('page_unlocked') === '1') {
  document.getElementById('password-gate').classList.remove('show');
}
</script>
